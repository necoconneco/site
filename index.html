<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Website Seized</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      font-family: Arial, sans-serif;
    }

    #container {
      text-align: center;
    }

    #banner {
      max-width: 100vw;
      max-height: 100vh;
      cursor: pointer;
    }

    #message {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #888888;
    }
  </style>
</head>
<body>
  <div id="container">
    <img id="banner"/>
    <div id="message"></div>
  </div>

  <script>
    (function() {
      const jsonUrl = "https://seized.fyi/banners.json";
      const bannerBaseUrl = "https://seized.fyi/b/";
      const fallbackClickUrl = "indeex.html";

      const bannerImg = document.getElementById("banner");
      const messageEl = document.getElementById("message");

      function setMessage(text) {
        if (messageEl) {
          messageEl.textContent = text;
        }
      }

      function pickRandomBanner(entries) {
        const images = entries.filter(function(entry) {
          return entry &&
                 entry.video === false &&
                 typeof entry.mime === "string" &&
                 entry.mime.startsWith("image/") &&
                 typeof entry.filename === "string";
        });

        if (images.length === 0) {
          throw new Error("No image banners found in JSON.");
        }

        const idx = Math.floor(Math.random() * images.length);
        return images[idx];
      }

      function init() {

        fetch(jsonUrl)
          .then(function(response) {
            if (!response.ok) {
              throw new Error("Network response was not ok: " + response.status);
            }
            return response.json();
          })
          .then(function(data) {
            try {
              if (!Array.isArray(data)) {
                throw new Error("Unexpected JSON format (expected array).");
              }

              const entry = pickRandomBanner(data);
              const imgUrl = bannerBaseUrl + entry.filename;

              bannerImg.src = imgUrl;

              bannerImg.onload = function() {
              };

              bannerImg.onerror = function() {
              };

              bannerImg.addEventListener("click", function() {
                var targetUrl = fallbackClickUrl;

                window.location.href = targetUrl;
              });
            } catch (e) {
              console.error(e);
            }
          })
          .catch(function(error) {
            console.error("Fetch error:", error);
          });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
